<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF35A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ranking Atena">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ranking Atena Tênis</title>
<style>
:root{color-scheme:light dark;--y:#FCF35A;--yl:#FFFBD6;--g:#3b3b36;--mut:#77756a;--line:#ece8cf;--bg:#fcfbf3;--ok:#1f7a3d;--up:#1f7a3d;--dn:#b3402a;
--card:#fff;--soft:var(--soft);--soft2:#f5f2dc;--prev:#fdfcf2;--ys:#f7ef7a;--ysx:#3b3b36;--upbg:#f3faf2;--dnbg:#fdf4f1;--nav:#2f2f2f;--selb:var(--selb);--meb:#cfc84a}
@media (prefers-color-scheme:dark){:root{--g:#ecebdc;--mut:#a5a392;--line:#3a3a32;--bg:#161613;--yl:#38351a;--ok:#5fcf80;--up:#5fcf80;--dn:#ff8a70;
--card:#22221e;--soft:#32312a;--soft2:#2d2c25;--prev:#1d1d1a;--ys:#6a6514;--ysx:#fff9a8;--upbg:#1b2a1d;--dnbg:#2f1f1b;--nav:#0f0f0d;--selb:#4a4a3d;--meb:#8f8a24}}
header,header p{color:#2f2f2f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--g);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--y);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;padding-top:calc(14px + env(safe-area-inset-top))}
header img{width:58px;height:58px;border-radius:10px;display:block}
header h1{margin:0;font-size:21px;line-height:1.15}
header p{margin:2px 0 0;font-size:14px;color:#4a493c}
nav{position:sticky;top:0;z-index:5;background:var(--nav);display:flex;overflow-x:auto}
nav button{flex:1 0 auto;min-width:64px;min-height:52px;border:0;background:transparent;color:#d8d5b0;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;border-bottom:4px solid transparent;padding:0 8px}
nav button[aria-selected=true]{color:var(--y);border-bottom-color:var(--y)}
main{max-width:680px;margin:0 auto;padding:12px 10px 36px}
h2{font-size:17px;margin:18px 0 4px;font-weight:650}
.sub{margin:0 0 12px;color:var(--mut);font-size:15px}
.me{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;margin-bottom:4px}
.me label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.sbox{position:relative}
.sbox input{padding-right:40px!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#wclr{position:absolute;right:4px;top:3px;width:36px;height:36px;border:0;background:transparent;color:var(--mut);font-size:16px;cursor:pointer}
#sug{position:absolute;z-index:20;left:0;right:0;top:46px;margin:0;padding:4px 0;list-style:none;background:var(--card);border:1px solid var(--selb);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#sug li{padding:11px 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line)}
#sug li:first-child{border-top:0}#sug li small{color:var(--mut);font-size:12px}#sug li.none{color:var(--mut)}
.me input,.srch{width:100%;min-height:42px;font-size:16px;border:1px solid var(--selb);border-radius:10px;padding:0 10px;background:var(--card);color:var(--g);font-family:inherit}
.mine-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--yl);font-size:16px}
.mine-box p{margin:0 0 6px}.mine-box p:last-child{margin:0}
.cards{display:grid;gap:8px}
.match{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px 8px}
.match.mine{border:1px solid var(--meb);background:var(--yl);box-shadow:0 0 0 2px var(--y)}
.match.prev{background:var(--prev);border-style:dashed}
.meta{font-size:12px;color:var(--mut);margin-bottom:0}
.pl{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:16px;min-height:36px}
.pl .n{flex:1;min-width:0;overflow-wrap:anywhere}
.pl .n.tbd{color:var(--mut);font-size:14px}
.pl .n.tbd small{display:block;font-size:12px}
.g{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:7px;font-weight:500;font-size:16px;color:var(--mut);background:var(--soft)}
.g.sw{background:var(--ys);color:var(--ysx);font-weight:700}
.g.tb{min-width:42px;gap:2px}
.g small{font-size:10px;font-weight:700;letter-spacing:.3px;opacity:.75}
.pl.w .n{font-weight:700}
.pl.w .n::after{content:" ✓";color:var(--ok)}
.pl.l .n{color:var(--mut)}
.wo{font-size:13px;font-weight:800;background:var(--nav);color:var(--y);border-radius:8px;padding:4px 9px}
.st{margin-top:2px;font-size:12.5px;color:var(--mut)}
.st b{color:var(--g)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:17px}
th{background:var(--nav);color:var(--y);font-weight:600;font-size:13px;padding:9px 6px;text-align:center;white-space:nowrap}
td{padding:12px 6px;text-align:center;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
td:nth-child(2){font-weight:600;padding-right:10px}
td:first-child{font-weight:800;width:44px}
td.z{width:30px;font-size:15px;font-weight:800}
td.z.up{color:var(--up)}td.z.down{color:var(--dn)}
tr.me-row td{background:var(--y);color:#2f2f2f}
.legend{font-size:13px;color:var(--mut);margin:8px 2px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
details .in{padding:0 14px 12px}
.res{padding:6px 0;border-top:1px solid var(--line);font-size:16px}
.res small{display:block;color:var(--mut);font-size:14px}
.csec h2{margin-top:22px}
.how{margin-top:22px;background:var(--card);border:1px dashed var(--mut);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mut)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:start}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.col h3{margin:0;background:var(--nav);color:var(--y);font-size:13px;font-weight:600;text-align:center;padding:6px 2px}
.col ol{list-style:none;margin:0;padding:0}
.col li{display:flex;gap:4px;align-items:center;height:29px;padding:0 4px;border-top:1px solid var(--line);font-size:12.5px;letter-spacing:-.1px;white-space:nowrap}
.col li:first-child{border-top:0}
.col li i{font-style:normal;color:var(--mut);width:13px;text-align:right;font-size:11px;flex:none}
.col li span{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.col li u{text-decoration:none;font-size:8px;flex:none;margin-left:-2px}
.col li.up u{color:var(--up)}.col li.down u{color:var(--dn)}
.col li.up{background:var(--upbg)}.col li.down{background:var(--dnbg)}
.col li.me-row{background:var(--y);color:#2f2f2f;font-weight:700}
.dbox{margin-top:10px}
.dbox .tw{margin-top:0}
td.z{font-size:13px}
td{padding:7px 6px}
table{font-size:15px}
.match{display:flex;align-items:stretch;gap:8px;padding:3px 10px 3px 0!important;overflow:hidden}
.jn{flex:none;width:40px;background:var(--soft2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);border-right:1px solid var(--line)}
.jn b{font-size:15px;color:var(--g)}.jn small{font-size:9.5px}
.pls{flex:1;min-width:0}
.pl{min-height:28px!important;padding:0!important;font-size:15px!important}
.pl+.pl{border-top:1px dashed var(--line)}
.g{min-width:24px!important;height:24px!important;font-size:14px!important;border-radius:6px!important}
.g.tb{min-width:38px!important}
.cards{gap:6px!important}
.round{background:var(--nav);color:var(--y);text-align:center;font-size:14px;padding:7px 10px;font-weight:600}
.round b{font-weight:800}
a{color:var(--g);font-weight:600}
table.yr{width:100%}.yr td:first-child{white-space:nowrap}.yr td small{color:var(--mut);font-size:12px}.yr td,.yr th{padding:7px 8px;text-align:left}.yr tr.now td{background:var(--yl)}
.hc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0}.hc .in{padding:2px 12px 10px}
.hcl{padding:6px 0;border-top:1px solid var(--line)}.hcl:first-child{border-top:0}.hcl b{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.hcl span{display:block;font-size:15px;line-height:1.5}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 28px}
</style>
</head>

/* quem ocupa a vaga `slot` depois da rodada `ri` (nome, se já definido; senão "vencedor/perdedor do jogo X") */
function occupant(cls, ri, slot){
  const g = gameWith(cls, ri, slot); if(!g) return {label:"a definir"};
  const better = slot === Math.min(g.a, g.b);
  if(isDone(g)){
    if(g.folga) return {name: slot === g.a ? g.p1 : g.p2};
    const win = g.w === 1 ? g.p1 : g.p2, lose = g.w === 1 ? g.p2 : g.p1;
    return {name: better ? win : lose};
  }
  const who = better ? "vencedor" : "perdedor";
  return {label: `${who} do jogo ${g.j}`, opts: named(g) ? [g.p1, g.p2] : null};
}
function slotName(cls, ri, g, side){            /* nome (ou rótulo) de quem joga o jogo g da rodada ri */

function mineBox(){

    const nxt = rnd(cls, r.ri + 1);
    const nextVs = slot => { if(!nxt) return null; const g2 = gameWith(cls, r.ri + 1, slot); if(!g2) return null;
      const o = slot === g2.a ? g2.b : g2.a; return occupant(cls, r.ri, o); };

function bindWho(){

    const m = all.filter(x => norm(x.n).split(/\s+/).some(w => w.startsWith(q)) || norm(x.n).startsWith(q) || norm(x.n).includes(q)).slice(0, 6);

function shortNames(list){
  const base = n => { const p = n.trim().split(/\s+/); return p.length < 2 ? p[0] : p[0] + " " + p[1][0] + "."; };
  const cnt = {}; list.forEach(n => { const b = base(n); cnt[b] = (cnt[b]||0) + 1; });
  return list.map(n => cnt[base(n)] > 1 ? n : base(n));
}

    const cls = D[tab], r = rnd(cls, cls.atual), nxt = rnd(cls, cls.atual + 1);
    const feitos = r.games.filter(g => named(g) && isDone(g)).length, total = r.games.filter(named).length;
    const old = cls.rounds.filter(x => x.ri < cls.atual).reverse().map(x => `<details><summary>Rodada ${x.n} · encerrada em ${x.prazo}</summary><div class="in">${
      x.games.filter(named).map(g => { if(g.folga) return `<div class="res">${esc(g.p1)} x ${esc(g.p2)}<small>jogo cancelado</small></div>`;
        const w = g.w === 1 ? g.p1 : g.p2, l = g.w === 1 ? g.p2 : g.p1;
        return `<div class="res"><b>${esc(w)}</b> venceu ${esc(l)}<small>${scoreTxt(g)}</small></div>`; }).join("")}</div></details>`).join("");
    app.innerHTML = meSelect() + `<h2>Classe ${tab} · Rodada ${r.n}</h2>
      <p class="sub">${feitos} de ${total} jogos concluídos</p>
      <div class="cards">${r.games.map(g => matchCard(cls, r, g, false)).join("")}</div>
      ${nxt ? `<h2>Próxima rodada · ${nxt.n}</h2><p class="sub">Os nomes aparecem quando os jogos de que dependem terminam.</p><div class="cards">${nxt.games.map(g => matchCard(cls, nxt, g, true)).join("")}</div>` : `<p class="how">Esta é a última rodada do ciclo. Depois dela as posições finais definem quem sobe e quem desce.</p>`}
      <h2>Rodadas anteriores</h2>${old || '<p class="sub">Ainda não há rodadas encerradas.</p>'}`;
  }
  bindWho();
}

function parseCSV(t){
  const rows = []; let row = [], f = "", q = false;
  for(let i = 0; i < t.length; i++){
    const ch = t[i];
    if(q){ if(ch === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if(ch === '"') q = true;
    else if(ch === ","){ row.push(f); f = ""; }
    else if(ch === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if(ch !== "\r") f += ch;
  }
  if(f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const numOrNull = v => (v === undefined || v === "" || isNaN(+v)) ? null : +v;
function applyRows(rows){
  const ci = rows.find(r => r[0] === "CICLO"); if(!ci) throw new Error("sem ciclo");
  const cic = +ci[1]; if(!cic) throw new Error("ciclo inválido");
  const jm = {}, prazo = {};
  rows.filter(r => r[0] === "JOGO").forEach(r => { jm[r[1] + "|" + r[2] + "|" + r[3]] = r; if(r[14]) prazo[r[2]] = r[14]; });
  const cls = {};
  rows.filter(r => r[0] === "CLASSE" && r[3]).forEach(r => { (cls[r[1]] = cls[r[1]] || []).push({pos:+r[2], nome:r[3], z:/subir/.test(r[4]||"") ? "up" : /cair/.test(r[4]||"") ? "down" : ""}); });
  if(CATS.some(c => !(cls[c] && cls[c].length))) throw new Error("classificação vazia");
  DATA.ciclo = cic;
  CATS.forEach(c => {
    const cl = D[c];
    cl.rounds.forEach(r => {
      r.n = 4*(cic-1) + r.ri; if(prazo[r.n]) r.prazo = prazo[r.n];
      r.games.forEach(g => {
        const x = jm[c + "|" + r.n + "|" + g.j] || [];
        g.p1 = x[4] || ""; g.p2 = x[5] || "";
        const s = [numOrNull(x[6]), numOrNull(x[7]), numOrNull(x[8]), numOrNull(x[9])], t = [numOrNull(x[10]), numOrNull(x[11])];
        g.sets = s.every(v => v !== null) ? [[s[0], s[1]], [s[2], s[3]]] : [];
        g.tb = t[0] !== null && t[1] !== null ? t : null;
        const w = x[13] || ""; g.w = w && w === g.p1 ? 1 : (w && w === g.p2 ? 2 : 0); g.folga = w === "FOLGA"; g.wo = /W\.O\./.test(x[12] || "");
      });
    });
    const named = cl.rounds.filter(r => r.games.some(g => g.p1 && g.p2));
    const pend = named.filter(r => r.games.some(g => g.p1 && g.p2 && g.w === 0 && !g.folga));
    cl.atual = (pend[0] || named[named.length-1] || cl.rounds[0]).ri;
    cl.live = cls[c].sort((a,b) => a.pos - b.pos);
  });
}
function setUpd(t){ const u = $("#upd"); if(u) u.textContent = t; }
async function refreshData(){
  if(typeof SHEET_CSV_URL === "undefined" || !SHEET_CSV_URL) return;
  try{
    const r = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    applyRows(parseCSV(await r.text()));
    if(me && !known(me)) me = "";
    const d = new Date(); setUpd("Atualizado hoje às " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"));
    const keep = document.activeElement && document.activeElement.id === "who";
    if(!keep) render();
  } catch(e){ setUpd("Sem conexão com a planilha · mostrando dados salvos"); }
}
